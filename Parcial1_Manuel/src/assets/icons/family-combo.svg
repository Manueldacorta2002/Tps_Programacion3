<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Outer pizza box / family-style whole pizza from above -->
  <!-- Extra-large whole pizza with more toppings -->
  <!-- Outer crust border -->
  <circle cx="50" cy="50" r="46" fill="#E8943A"/>
  <!-- Inner crust ring (browned) -->
  <circle cx="50" cy="50" r="40" fill="#FFC72C"/>
  <!-- Sauce -->
  <circle cx="50" cy="50" r="36" fill="#E53935"/>
  <!-- Cheese base -->
  <circle cx="50" cy="50" r="33" fill="#FFF9C4"/>
  <!-- 8 Pepperoni (bigger pizza = more toppings) -->
  <circle cx="50" cy="31" r="7" fill="#C62828"/>
  <circle cx="33" cy="39" r="7" fill="#C62828"/>
  <circle cx="27" cy="55" r="7" fill="#C62828"/>
  <circle cx="36" cy="69" r="7" fill="#C62828"/>
  <circle cx="50" cy="74" r="7" fill="#C62828"/>
  <circle cx="64" cy="69" r="7" fill="#C62828"/>
  <circle cx="73" cy="55" r="7" fill="#C62828"/>
  <circle cx="67" cy="39" r="7" fill="#C62828"/>
  <!-- Pepperoni center spots -->
  <circle cx="50" cy="31" r="3" fill="#B71C1C"/>
  <circle cx="33" cy="39" r="3" fill="#B71C1C"/>
  <circle cx="27" cy="55" r="3" fill="#B71C1C"/>
  <circle cx="36" cy="69" r="3" fill="#B71C1C"/>
  <circle cx="50" cy="74" r="3" fill="#B71C1C"/>
  <circle cx="64" cy="69" r="3" fill="#B71C1C"/>
  <circle cx="73" cy="55" r="3" fill="#B71C1C"/>
  <circle cx="67" cy="39" r="3" fill="#B71C1C"/>
  <!-- Cheese melt lines -->
  <path d="M 32 36 Q 50 32 68 36" stroke="#FFF176" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M 28 52 Q 50 48 72 52" stroke="#FFF176" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M 32 66 Q 50 62 68 66" stroke="#FFF176" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>
  <!-- Shine -->
  <path d="M 34 32 Q 42 23 53 28 Q 48 40 34 32Z" fill="white" opacity="0.2"/>
</svg>
