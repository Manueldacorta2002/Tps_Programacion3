<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Top bun dome (taller = more patties) -->
  <path d="M 14 44 C 14 6 86 6 86 44 Z" fill="#F5A623"/>
  <!-- Seeds -->
  <ellipse cx="34" cy="20" rx="5" ry="2.5" fill="#CF7F00" transform="rotate(-18,34,20)"/>
  <ellipse cx="50" cy="14" rx="5" ry="2.5" fill="#CF7F00"/>
  <ellipse cx="66" cy="20" rx="5" ry="2.5" fill="#CF7F00" transform="rotate(18,66,20)"/>
  <!-- Shine on bun -->
  <path d="M 25 18 Q 33 10 43 14 Q 39 25 25 18Z" fill="white" opacity="0.22"/>
  <!-- Bun base -->
  <rect x="14" y="42" width="72" height="7" rx="3" fill="#F5A623"/>
  <!-- Lettuce -->
  <path d="M 10 51 Q 18 44 26 51 Q 34 44 42 51 Q 50 44 58 51 Q 66 44 74 51 Q 82 44 90 51 L 90 56 L 10 56 Z" fill="#56A850"/>
  <!-- Cheese 1 -->
  <polygon points="10,56 90,56 94,62 6,62" fill="#FFC107"/>
  <!-- Patty 1 -->
  <rect x="12" y="62" width="76" height="9" rx="4" fill="#6D4C41"/>
  <!-- Cheese 2 (second layer) -->
  <polygon points="10,71 90,71 94,77 6,77" fill="#FFD740"/>
  <!-- Patty 2 -->
  <rect x="12" y="77" width="76" height="9" rx="4" fill="#5D4037"/>
  <!-- Bottom bun -->
  <rect x="14" y="86" width="72" height="11" rx="7" fill="#E8943A"/>
</svg>
