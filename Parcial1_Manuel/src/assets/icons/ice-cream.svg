<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Cone shape -->
  <path d="M 30 60 L 50 98 L 70 60 Z" fill="#E8943A"/>
  <!-- Cone grid lines (diagonal) -->
  <path d="M 50 98 L 36 64" stroke="#CF7F00" stroke-width="1.5" opacity="0.6"/>
  <path d="M 50 98 L 42 61" stroke="#CF7F00" stroke-width="1.5" opacity="0.6"/>
  <path d="M 50 98 L 58 61" stroke="#CF7F00" stroke-width="1.5" opacity="0.6"/>
  <path d="M 50 98 L 64 64" stroke="#CF7F00" stroke-width="1.5" opacity="0.6"/>
  <!-- Horizontal cone lines -->
  <path d="M 37 74 Q 50 78 63 74" stroke="#CF7F00" stroke-width="1.5" fill="none"/>
  <path d="M 42 86 Q 50 89 58 86" stroke="#CF7F00" stroke-width="1.5" fill="none"/>
  <!-- Bottom scoop (strawberry/vanilla) -->
  <circle cx="50" cy="50" r="20" fill="#FFCCBC"/>
  <!-- Top scoop (blueberry/chocolate) -->
  <circle cx="50" cy="31" r="18" fill="#CE93D8"/>
  <!-- Scoops highlight -->
  <circle cx="42" cy="44" r="6" fill="white" opacity="0.32"/>
  <circle cx="42" cy="25" r="5" fill="white" opacity="0.32"/>
  <!-- Chocolate chips on bottom scoop -->
  <ellipse cx="55" cy="54" rx="3" ry="1.8" fill="#5D4037"/>
  <ellipse cx="46" cy="57" rx="3" ry="1.8" fill="#5D4037"/>
  <!-- Sprinkles on top -->
  <rect x="43" y="22" width="8" height="3" rx="1.5" fill="#E53935" transform="rotate(25,47,23)"/>
  <rect x="53" y="28" width="7" height="3" rx="1.5" fill="#FFC107" transform="rotate(-18,56,30)"/>
  <rect x="40" y="31" width="7" height="3" rx="1.5" fill="#4CAF50" transform="rotate(8,43,33)"/>
</svg>
