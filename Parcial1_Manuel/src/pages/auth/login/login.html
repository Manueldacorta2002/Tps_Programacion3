<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.svg">
    <title>Food Store - Login</title>
</head>

<body>
    <div class="login-wrapper">
        <div class="brand-banner" aria-hidden="true">
            <span class="brand-banner-logo">FS</span>
            <span class="brand-banner-text">Food Store</span>
        </div>

        <div class="login-card">
            <div class="login-header">
                <div class="logo">FS</div>
                <h1>Food Store</h1>
                <p>Ingresá para continuar</p>
            </div>

            <form id="form" novalidate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email"
                        placeholder="ejemplo@correo.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" autocomplete="current-password"
                        placeholder="••••••••">
                </div>

                <div id="errorMsg" class="error-msg" style="display:none;"></div>

                <button type="submit" class="btn-login" id="btnLogin">Ingresar</button>
            </form>
            <p class="login-footer-link">¿No tenés cuenta? <a href="../registro/registro.html">Registrate</a></p>
        </div>
    </div>

    <footer>
        <p>Proyecto Programación 3 — Manuel Da Corta — 2026</p>
    </footer>

    <script type="module" src="./login.ts"></script>
</body>

</html>
