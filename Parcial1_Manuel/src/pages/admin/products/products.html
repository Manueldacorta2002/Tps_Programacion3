<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg">
  <title>Food Store - Productos</title>
</head>

<body>
  <header>
    <div class="brand">
      <h1>Productos</h1>
      <span class="subtitle">Panel de administración</span>
    </div>
    <nav>
      <a href="../home/home.html" class="admin-btn-ghost">← Volver</a>
      <button id="logoutButton">Salir</button>
    </nav>
  </header>

  <main>
    <div class="admin-toolbar">
      <h2 class="section-title">Gestión de Productos</h2>
      <button class="admin-btn-primary" id="btnNuevoProducto">+ Nuevo producto</button>
    </div>

    <!-- Formulario alta/edición -->
    <div id="formPanel" class="add-product-form" style="display:none;">
      <h4 class="form-title" id="formTitle">Nuevo producto</h4>
      <form id="productoForm" novalidate>
        <input type="hidden" id="inputId">
        <div class="form-row">
          <div class="form-field">
            <label for="inputNombre">Nombre</label>
            <input type="text" id="inputNombre" placeholder="Ej: Hamburguesa clásica" required>
          </div>
          <div class="form-field">
            <label for="inputCategoria">Categoría</label>
            <select id="inputCategoria" required></select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label for="inputPrecio">Precio ($)</label>
            <input type="number" id="inputPrecio" placeholder="Ej: 2500" min="1" required>
          </div>
          <div class="form-field">
            <label for="inputStock">Stock</label>
            <input type="number" id="inputStock" placeholder="Ej: 20" min="0" required>
          </div>
        </div>
        <div class="form-field">
          <label for="inputDescripcion">Descripción</label>
          <input type="text" id="inputDescripcion" placeholder="Descripción del producto" required>
        </div>
        <div class="form-field">
          <label for="inputImagen">URL de imagen</label>
          <input type="text" id="inputImagen" placeholder="https://...">
        </div>
        <div class="form-field form-field-check">
          <label>
            <input type="checkbox" id="inputDisponible" checked>
            Disponible en el catálogo
          </label>
        </div>
        <p id="formError" class="error-msg" style="display:none;"></p>
        <div class="form-actions">
          <button type="submit" class="admin-btn-primary" id="btnSubmit">Guardar</button>
          <button type="button" class="admin-btn-ghost" id="btnCancelar">Cancelar</button>
        </div>
      </form>
    </div>

    <div id="tableContainer"></div>
  </main>

  <footer>
    <p>Proyecto Programación 3 — Manuel Da Corta — 2026</p>
  </footer>

  <script type="module" src="./products.ts"></script>
</body>

</html>
